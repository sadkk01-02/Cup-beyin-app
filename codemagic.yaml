workflows:
  ios-ipa-build:
    name: iOS Unsigned IPA Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS without code signing
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=FLUTTER_WEB_USE_SKIA=true || true
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package IPA into Payload
        script: |
          mkdir -p build/ios/ipa_out/Payload
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          echo "Found Runner.app at: $APP_PATH"
          cp -r "$APP_PATH" build/ios/ipa_out/Payload/
          cd build/ios/ipa_out && zip -r -y CupBeyin.ipa Payload 
  artifacts:
    - build/ios/ipa_out/CupBeyin.ipa
  publishing:
    scripts:
      - name: Publish IPA to GitHub Release
        script: |
          set -e
          TAG="ipa-latest"
          REPO="sadkk01-02/Cup-beyin-app"
          IPA_PATH="build/ios/ipa_out/CupBeyin.ipa"

          if [ -z "$GH_RELEASE_TOKEN" ]; then
            echo "GH_RELEASE_TOKEN is missing"
            exit 1
          fi

          AUTH_HEADER="Authorization: Bearer $GH_RELEASE_TOKEN"
          ACCEPT_HEADER="Accept: application/vnd.github+json"

          RELEASE_JSON=$(curl -sS -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" || true)
          RELEASE_ID=$(echo "$RELEASE_JSON" | grep -m1 '"id":' | sed -E 's/[^0-9]*([0-9]+).*/\1/' || true)

          if [ -n "$RELEASE_ID" ]; then
            curl -sS -X DELETE -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
              "https://api.github.com/repos/$REPO/releases/$RELEASE_ID" >/dev/null
          fi

          CREATE_RES=$(curl -sS -X POST -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
            "https://api.github.com/repos/$REPO/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"CupBeyin IPA\",\"draft\":false,\"prerelease\":false}")

          UPLOAD_URL=$(echo "$CREATE_RES" | grep -m1 '"upload_url":' | sed -E 's/.*"upload_url": *"([^\{"]+).*/\1/')

          if [ -z "$UPLOAD_URL" ]; then
            echo "Failed to create release: $CREATE_RES"
            exit 1
          fi

          curl -sS -X POST \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$IPA_PATH" \
            "${UPLOAD_URL}?name=CupBeyin.ipa"

          echo "Uploaded CupBeyin.ipa to GitHub Release ($TAG)"
